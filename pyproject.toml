[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweden-accessibility-map"
version = "0.1.0"
description = "Accessibility mapping for Sweden"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
geo = ["shapely>=2.1,<3", "pyproj>=3.6,<4"]

[project.scripts]
import-uppsala-population = "accessibility.population:main"
import-uppsala-grid = "accessibility.population_grid:main"
build-population-map = "accessibility.population_map:main"
import-uppsala-restaurants = "accessibility.restaurants:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accessibility = ["map_assets/*"]
